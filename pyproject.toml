[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "apels-iqcqp"
version = "0.2.0"
description = "Multiobjective integer quadratic solver"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apels-iqcqp = "mo_iqcqp.cli:main"
mo-iqcqp = "mo_iqcqp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
