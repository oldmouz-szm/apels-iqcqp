[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mo-iqcqp"
version = "0.1.0"
description = "Adaptive multiobjective integer quadratic solver"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mo-iqcqp = "mo_iqcqp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
